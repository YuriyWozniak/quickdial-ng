# CI: checks every push and pull request. Each job runs on its own fresh Ubuntu machine, in parallel.
# The jobs only call the repository's own scripts, so any failure can be reproduced locally with the same command.
name: CI

on:
  push:
    branches: ['**'] # every branch (tags are left to the release workflow)
  pull_request:
    branches: [develop] # also pull requests from forks
  workflow_dispatch: # the "Run workflow" button on the Actions tab
  workflow_call: # the Release workflow runs all of CI first

# The jobs only read the repository
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going for the old one
# (github.workflow is the caller's name when Release runs CI, so the two never cancel each other)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check # ESLint and the type check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:unit # plain Node, nothing to install

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: test/package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node run.js

  package:
    name: package (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: release/package.json
      - run: npm install --no-audit --no-fund
      # The same lint rules as release.js uses for the GitHub builds
      - run: npx web-ext lint --source-dir ../src --self-hosted --warnings-as-errors
      - run: npx web-ext build --source-dir ../src --artifacts-dir ../web-ext-artifacts --overwrite-dest
      # Downloadable from the run's page; load it in Firefox from about:debugging (unsigned)
      - uses: actions/upload-artifact@v7
        with:
          name: quickdial-ng-unsigned-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          retention-days: 14

  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A version bumped in src/manifest.json must come with its notes in release/amo-listing.md
      - run: node release/notes.js --check
