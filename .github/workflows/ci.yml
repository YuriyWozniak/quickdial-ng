# CI: checks every pull request and every push to develop. Each job runs on its own fresh Ubuntu machine, in parallel.
# The jobs only call the repository's own scripts, so any failure can be reproduced locally with the same command.
name: CI

on:
  # Only develop: a feature branch is checked by its pull request. With both events on every branch,
  # each push to a branch with an open pull request ran all of CI twice on the same commit.
  # A branch without a pull request yet can still be checked with "Run workflow".
  push:
    branches: [develop]
  pull_request:
    branches: [develop] # the branch merged into develop; also pull requests from forks
  workflow_dispatch: # the "Run workflow" button on the Actions tab
  workflow_call: # the Release workflow runs all of CI first

# The jobs only read the repository
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going for the old one
# (github.workflow is the caller's name when Release runs CI, so the two never cancel each other)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check # ESLint and the type check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:unit # plain Node, nothing to install

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: test/package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node run.js

  package:
    name: package (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: release/package.json
      - run: npm install --no-audit --no-fund
      # The same lint rules as release.js uses for the GitHub builds
      - run: node lint.js ../src --self-hosted
      - run: npx web-ext build --source-dir ../src --artifacts-dir ../web-ext-artifacts --overwrite-dest
      # Downloadable from the run's page; load it in Firefox from about:debugging (unsigned)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickdial-ng-unsigned-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          retention-days: 14

  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A version bumped in src/manifest.json must come with its notes in release/amo-listing.md
      - run: node release/notes.js --check
