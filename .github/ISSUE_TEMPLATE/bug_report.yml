name: Bug report
description: Something in Quick Dial NG doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Quick Dial NG version
      description: Shown in Settings, or on about:addons
      placeholder: e.g. 0.8.0
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Firefox version and system
      placeholder: e.g. Firefox 145 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab
        2. ...
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, errors from the Browser Console (Ctrl+Shift+J), the theme or settings you use. Please leave out private sites and bookmarks.
