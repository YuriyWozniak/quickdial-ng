<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="shortcut icon" type="image/svg+xml" href="../img/icon.svg" />
		<title data-i18n="menuSettings"></title>
		<link rel="stylesheet" href="../css/ui.css" />
		<link rel="stylesheet" href="../css/page.css" />
		<link rel="stylesheet" href="../css/settings.css" />
		<script type="text/javascript" src="../js/common.js"></script>
		<script type="text/javascript" src="../js/ui.js"></script>
		<script type="text/javascript" src="../js/themes.js"></script>
		<script type="text/javascript" src="/js/settings.js"></script>
		<script type="text/javascript" src="/js/settingsthemes.js"></script>
		<script type="text/javascript" src="/js/settingsbackup.js"></script>
	</head>
	<body class="qd qd-page qd-settings">
		<header class="qd-header">
			<div class="qd-header-icon" aria-hidden="true">
				<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
			</div>
			<div class="qd-header-text">
				<h1 class="qd-title" data-i18n="settingsTitle"></h1>
				<p class="qd-subtitle" id="Version">&nbsp;</p>
			</div>
		</header>

		<nav class="qd-tabs" id="Tabs" role="tablist" aria-orientation="vertical" data-i18n-aria-label="settingsTitle">
			<button type="button" class="qd-tab" role="tab" id="TabPageButton" aria-controls="TabPage" aria-selected="true"><svg class="qd-tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="16" height="11" rx="1.5"/><path d="M7 17h6M10 14v3"/></svg><span data-i18n="settingsTabPage"></span></button>
			<button type="button" class="qd-tab" role="tab" id="TabGridButton" aria-controls="TabGrid"><svg class="qd-tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg><span data-i18n="settingsTabGrid"></span></button>
			<button type="button" class="qd-tab" role="tab" id="TabTilesButton" aria-controls="TabTiles"><svg class="qd-tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 13h14"/></svg><span data-i18n="settingsTabTiles"></span></button>
			<button type="button" class="qd-tab" role="tab" id="TabThemesButton" aria-controls="TabThemes"><svg class="qd-tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5c-4.1 0-7.5 3.1-7.5 7.1 0 3.9 3.2 7.9 7.2 7.9 1.1 0 1.7-.7 1.7-1.5 0-1.1-.9-1.4-.9-2.4 0-.9.7-1.5 1.6-1.5h1.6c2.2 0 3.8-1.6 3.8-3.6 0-3.3-3.4-6-7.5-6Z"/><circle cx="6.5" cy="9" r=".9"/><circle cx="9.5" cy="6.2" r=".9"/><circle cx="13.2" cy="7.4" r=".9"/></svg><span data-i18n="settingsTabThemes"></span></button>
			<button type="button" class="qd-tab" role="tab" id="TabBackupButton" aria-controls="TabBackup"><svg class="qd-tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="15" height="4" rx="1"/><path d="M4 7v8.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V7M8 10.5h4"/></svg><span data-i18n="settingsTabBackup"></span></button>
		</nav>

		<div class="qd-side">
			<div class="qd-side-links">
				<button type="button" class="qd-side-link" id="BtnOpenDial" data-i18n-title="settingsOpenDial"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3h6v6M17 3l-8 8M14 12v3.5a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 3 15.5v-8A1.5 1.5 0 0 1 4.5 6H8"/></svg><span data-i18n="settingsOpenDial"></span></button>
				<a class="qd-side-link" href="https://qdng.srv.if.ua/" target="_blank" rel="noopener" data-i18n="settingsWebsite"></a>
				<a class="qd-side-link" href="https://github.com/YuriyWozniak/quickdial-ng" target="_blank" rel="noopener" data-i18n="settingsSourceCode"></a>
			</div>
		</div>

		<main class="qd-content" id="Content">
			<div class="qd-panel-head">
				<div>
					<h1 class="qd-panel-title" id="PanelTitle" data-i18n="settingsTabPage"></h1>
					<p class="qd-panel-intro" id="PanelIntro"></p>
				</div>
				<div class="qd-panel-tools" id="TilesTools" hidden>
					<div class="qd-segments" role="group" data-i18n-aria-label="settingsTabTiles">
						<button type="button" class="qd-segment" id="TilesPartTile" aria-pressed="true" aria-controls="TileRows" data-i18n="settingsGroupTile"></button>
						<button type="button" class="qd-segment" id="TilesPartTitle" aria-pressed="false" aria-controls="TitleRows" data-i18n="settingsGroupTitle"></button>
					</div>
				</div>
				<div class="qd-panel-tools" id="ThemesTools" hidden>
					<button type="button" class="qd-btn" id="BtnThemeSave" data-i18n-title="themeSaveCurrentHint" data-i18n="themeSaveCurrent"></button>
					<button type="button" class="qd-btn" id="BtnThemeExport" data-i18n-title="themeExportCurrentHint" data-i18n="themeExportCurrent"></button>
					<button type="button" class="qd-btn" id="BtnThemeImport" data-i18n-title="themeImportHint" data-i18n="themeImport"></button>
					<input id="ThemeFile" type="file" accept=".json,application/json" class="qd-file" data-no-dirty tabindex="-1">
				</div>
			</div>

			<!-- ===== Page ===== -->
			<div class="qd-panel qd-stack" id="TabPage" role="tabpanel" aria-labelledby="TabPageButton" data-i18n-intro="settingsPageIntro">
				<section class="qd-card">
					<h2 data-i18n="settingsBackground"></h2>
					<div class="qd-image">
						<div class="qd-preview is-screen" id="BackgroundZone" data-i18n-title="imageDropHere">
							<div class="qd-preview-img" id="BackgroundPreview"></div>
							<div class="qd-preview-drop" data-i18n="imageDropToUse"></div>
						</div>
						<div class="qd-image-controls">
							<div class="qd-pairs">
								<label class="qd-label" for="BackgroundColor" data-i18n="settingsColor"></label>
								<input id="BackgroundColor" type="color">
								<label class="qd-label" for="BackgroundMode" data-i18n="imageFit"></label>
								<select id="BackgroundMode">
									<option value="0" data-i18n="fitStretch"></option>
									<option value="1" data-i18n="fitCover"></option>
									<option value="2" data-i18n="fitContain"></option>
									<option value="3" data-i18n="fitCenter"></option>
								</select>
							</div>
							<div class="qd-inline">
								<label class="qd-btn is-small" for="BackgroundImageFile" id="BackgroundImageChoose" tabindex="0" role="button" data-i18n="imageChoose"></label>
								<input id="BackgroundImageFile" class="qd-file" type="file" accept="image/*" tabindex="-1">
								<button type="button" class="qd-btn is-small" id="BackgroundImageClear" data-i18n="settingsRemove"></button>
							</div>
							<span class="qd-hint" data-i18n="settingsBackgroundDropHint"></span>
							<div class="qd-inline" id="BackgroundGradientRow" hidden>
								<span class="qd-hint" data-i18n="settingsGradientHint"></span>
								<button type="button" class="qd-btn is-small" id="BackgroundGradientClear" data-i18n="settingsGradientRemove"></button>
							</div>
						</div>
					</div>
				</section>

				<section class="qd-card">
					<h2 data-i18n="settingsInterface"></h2>
					<div class="qd-setting">
						<label class="qd-setting-text" for="Language"><span data-i18n="settingsLanguage"></span><small data-i18n="settingsLanguageHint"></small></label>
						<select id="Language"><option value="" id="LanguageBrowser"></option></select>
					</div>
					<div class="qd-setting">
						<span class="qd-setting-text"><span data-i18n="settingsAccentColor"></span><small data-i18n="settingsAccentColorHint"></small></span>
						<div class="qd-inline">
							<div class="qd-segments" role="radiogroup" data-i18n-aria-label="settingsAccentColor">
								<label class="qd-segment"><input id="AccentDefault" type="radio" name="AccentSource"><span data-i18n="optionDefault"></span></label>
								<label class="qd-segment"><input id="AccentCustom" type="radio" name="AccentSource"><span data-i18n="settingsAccentCustom"></span></label>
							</div>
							<input id="AccentColor" type="color" data-i18n-aria-label="settingsAccentColor">
						</div>
					</div>
				</section>

				<section class="qd-card">
					<h2 data-i18n="settingsBehavior"></h2>
					<div class="qd-setting">
						<label class="qd-setting-text" for="MenuShowAdd"><span data-i18n="settingsMenuShowAdd"></span><small data-i18n="settingsMenuShowAddHint"></small></label>
						<input id="MenuShowAdd" type="checkbox" class="qd-switch">
					</div>
					<div class="qd-setting">
						<label class="qd-setting-text" for="ToolbarAction"><span data-i18n="settingsToolbarButton"></span><small data-i18n="settingsToolbarButtonHint"></small></label>
						<select id="ToolbarAction">
							<option value="settings" data-i18n="settingsToolbarSettings"></option>
							<option value="newtab" data-i18n="settingsToolbarNewTab"></option>
							<option value="current" data-i18n="settingsToolbarCurrentTab"></option>
						</select>
					</div>
					<p class="qd-note">
						<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4M8 4.8v.4"/></svg>
						<span><b data-i18n="settingsStartPage"></b> <span data-i18n="settingsStartPageHint"></span></span>
					</p>
				</section>
			</div>

			<!-- ===== Grid ===== -->
			<div class="qd-panel qd-stack" id="TabGrid" role="tabpanel" aria-labelledby="TabGridButton" data-i18n-intro="settingsGridIntro" hidden>
				<section class="qd-card">
					<h2 data-i18n="settingsLayout"></h2>
					<div class="qd-layout">
						<div>
							<div class="qd-setting">
								<label class="qd-setting-text" for="GridRows" data-i18n="settingsRowsColumns"></label>
								<div class="qd-inline">
									<span class="qd-number"><input id="GridRows" type="number" min="1" data-i18n-aria-label="settingsRows"></span>
									<span class="qd-sep">×</span>
									<span class="qd-number"><input id="GridColumns" type="number" min="1" data-i18n-aria-label="settingsColumns"></span>
								</div>
							</div>
							<div class="qd-setting">
								<label class="qd-setting-text" for="GridRatioX"><span data-i18n="settingsTileShape"></span><small data-i18n="settingsTileShapeHint"></small></label>
								<div class="qd-inline">
									<span class="qd-number"><input id="GridRatioX" type="number" min="1" data-i18n-aria-label="settingsRatioWidth"></span>
									<span class="qd-sep">:</span>
									<span class="qd-number"><input id="GridRatioY" type="number" min="1" data-i18n-aria-label="settingsRatioHeight"></span>
								</div>
							</div>
							<div class="qd-setting">
								<label class="qd-setting-text" for="GridMargins" data-i18n="settingsPageMargin"></label>
								<span class="qd-number"><input id="GridMargins" type="number" min="0">px</span>
							</div>
						</div>
						<figure class="qd-grid-preview">
							<div class="qd-grid-preview-stage" id="GridPreview"><div class="qd-grid-preview-cells" id="GridPreviewCells"></div></div>
							<figcaption class="qd-hint" id="GridPreviewCaption"></figcaption>
						</figure>
					</div>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridRoot"><span data-i18n="settingsBookmarksFolder"></span><small data-i18n="settingsBookmarksFolderHint"></small></label>
						<input id="GridRoot" type="text" spellcheck="false">
					</div>
				</section>

				<section class="qd-card">
					<h2 data-i18n="settingsOpening"></h2>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridOpenBookmarksIn" data-i18n="settingsOpenBookmarksIn"></label>
						<select id="GridOpenBookmarksIn">
							<option value="0" data-i18n="settingsOpenSameTab"></option>
							<option value="1" data-i18n="settingsOpenNewTab"></option>
						</select>
					</div>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridOpenFoldersIn" data-i18n="settingsOpenFoldersIn"></label>
						<select id="GridOpenFoldersIn">
							<option value="0" data-i18n="settingsOpenSameTab"></option>
							<option value="1" data-i18n="settingsOpenNewTab"></option>
						</select>
					</div>
				</section>

				<section class="qd-card">
					<h2 data-i18n="settingsGroupThumbnails"></h2>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridNewTilePicture"><span data-i18n="settingsNewTilePicture"></span><small data-i18n="settingsNewTilePictureHint"></small></label>
						<select id="GridNewTilePicture">
							<option value="0" data-i18n="tilePicturePage"></option>
							<option value="1" data-i18n="tilePictureSiteIcon"></option>
							<option value="2" data-i18n="tilePictureSiteIconOrPage"></option>
						</select>
					</div>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridCellsSnapshotDelay"><span data-i18n="settingsCaptureDelay"></span><small data-i18n="settingsCaptureDelayUnit"></small></label>
						<span class="qd-number"><input id="GridCellsSnapshotDelay" type="number" min="300" max="10000" step="100">ms</span>
					</div>
					<div class="qd-setting">
						<span class="qd-setting-text"><span data-i18n="settingsTilesYouHave"></span><small id="TilePictureStatus" role="status"></small></span>
						<button type="button" class="qd-btn" id="BtnApplyTilePicture" data-no-dirty data-i18n-title="settingsApplyTilePictureHint" data-i18n="settingsApplyTilePicture"></button>
					</div>
				</section>

				<section class="qd-card">
					<h2 data-i18n="settingsFolderTiles"></h2>
					<div class="qd-setting">
						<label class="qd-setting-text" for="GridBackNode" data-i18n="settingsBackNode"></label>
						<input id="GridBackNode" type="checkbox" class="qd-switch">
					</div>
					<div class="qd-split">
						<div class="qd-image is-stacked">
							<span class="qd-label" data-i18n="settingsBackPicture"></span>
							<div class="qd-preview is-small" id="GridBackZone" data-i18n-title="imageDropHere">
								<div class="qd-preview-img" id="GridBackPreview"></div>
								<div class="qd-preview-drop" data-i18n="imageDropToUse"></div>
							</div>
							<div class="qd-inline">
								<select id="GridBackMode" data-i18n-aria-label="settingsBackPictureFit">
									<option value="0" data-i18n="fitStretch"></option>
									<option value="1" data-i18n="fitCover"></option>
									<option value="2" data-i18n="fitContain"></option>
									<option value="3" data-i18n="fitCenter"></option>
								</select>
								<label class="qd-btn is-small" for="GridBackImageFile" tabindex="0" role="button" data-i18n="imageChooseShort"></label>
								<input id="GridBackImageFile" class="qd-file" type="file" accept="image/*" tabindex="-1">
								<button type="button" class="qd-btn is-small" id="GridBackImageReset" data-i18n-title="settingsResetHint" data-i18n="settingsReset"></button>
							</div>
						</div>
						<div class="qd-image is-stacked">
							<span class="qd-label" data-i18n="settingsFolderPicture"></span>
							<div class="qd-preview is-small" id="GridFolderZone" data-i18n-title="imageDropHere">
								<div class="qd-preview-img" id="GridFolderPreview"></div>
								<div class="qd-preview-drop" data-i18n="imageDropToUse"></div>
							</div>
							<div class="qd-inline">
								<select id="GridFolderMode" data-i18n-aria-label="settingsFolderPictureFit">
									<option value="0" data-i18n="fitStretch"></option>
									<option value="1" data-i18n="fitCover"></option>
									<option value="2" data-i18n="fitContain"></option>
									<option value="3" data-i18n="fitCenter"></option>
								</select>
								<label class="qd-btn is-small" for="GridFolderImageFile" tabindex="0" role="button" data-i18n="imageChooseShort"></label>
								<input id="GridFolderImageFile" class="qd-file" type="file" accept="image/*" tabindex="-1">
								<button type="button" class="qd-btn is-small" id="GridFolderImageReset" data-i18n-title="settingsResetHint" data-i18n="settingsReset"></button>
							</div>
						</div>
					</div>
				</section>
			</div>

			<!-- ===== Tiles ===== -->
			<div class="qd-panel qd-cols is-wide" id="TabTiles" role="tabpanel" aria-labelledby="TabTilesButton" data-i18n-intro="settingsTilesIntro" hidden>
				<div class="qd-aside">
					<section class="qd-card">
						<div class="qd-tile-stage" id="TileStage">
							<figure class="qd-tile-figure">
								<div class="qd-tile-slot"><div class="qd-tile" id="TileNormal"><div class="qd-tile-img"></div><div class="qd-tile-title" data-i18n="tileExampleSite"></div></div></div>
								<figcaption class="qd-tile-caption" data-i18n="tileNormal"></figcaption>
							</figure>
							<figure class="qd-tile-figure">
								<div class="qd-tile-slot"><div class="qd-tile" id="TileHover"><div class="qd-tile-img"></div><div class="qd-tile-title" data-i18n="tileExampleSite"></div></div></div>
								<figcaption class="qd-tile-caption" data-i18n="tileHover"></figcaption>
							</figure>
						</div>
						<p class="qd-hint qd-stage-hint" data-i18n="settingsClickEffectHint"></p>
					</section>
					<section class="qd-card">
						<h2 data-i18n="settingsEffects"></h2>
						<div class="qd-setting">
							<label class="qd-setting-text" for="GridCellsHoverEffect" data-i18n="settingsHoverEffect"></label>
							<select id="GridCellsHoverEffect">
								<option value="0" data-i18n="hoverInstant"></option>
								<option value="1" data-i18n="hoverSmooth"></option>
								<option value="2" data-i18n="hoverLift"></option>
								<option value="3" data-i18n="hoverGrow"></option>
							</select>
						</div>
						<div class="qd-setting">
							<label class="qd-setting-text" for="GridCellsClickEffect"><span data-i18n="settingsClickEffect"></span><small id="ReducedMotionHint" hidden data-i18n="settingsReducedMotionHint"></small></label>
							<select id="GridCellsClickEffect">
								<option value="0" data-i18n="optionNone"></option>
								<option value="1" data-i18n="clickPress"></option>
								<option value="2" data-i18n="clickBounce"></option>
								<option value="3" data-i18n="clickRipple"></option>
								<option value="4" data-i18n="clickFlash"></option>
								<option value="5" data-i18n="clickRing"></option>
							</select>
						</div>
					</section>
				</div>

				<section class="qd-card is-table">
					<table class="qd-table">
						<thead>
							<tr><th data-i18n="settingsSameAsNormal"></th><th data-i18n="tileNormal"></th><th data-i18n="tileHover"></th></tr>
						</thead>
						<tbody id="TileRows">
							<tr>
								<td data-i18n="settingsSpacing"></td>
								<td><span class="qd-number"><input id="GridCellsMargins" type="number" min="0">px</span></td>
								<td><span class="qd-number"><input id="GridCellsMarginsHover" type="number" min="0">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsOpacity"></td>
								<td><span class="qd-number"><input id="GridCellsOpacity" type="number" min="0" max="100" step="5">%</span></td>
								<td><span class="qd-number"><input id="GridCellsOpacityHover" type="number" min="0" max="100" step="5">%</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsBorderWidth"></td>
								<td><span class="qd-number"><input id="GridCellsBorderSize" type="number" min="0">px</span></td>
								<td><span class="qd-number"><input id="GridCellsBorderSizeHover" type="number" min="0">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsCornerRadius"></td>
								<td><span class="qd-number"><input id="GridCellsBorderRadius" type="number" min="0">px</span></td>
								<td><span class="qd-number"><input id="GridCellsBorderRadiusHover" type="number" min="0">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsBorderColor"></td>
								<td><input id="GridCellsBorderColor" type="color"></td>
								<td><input id="GridCellsBorderColorHover" type="color"></td>
							</tr>
							<tr>
								<td data-i18n="settingsBackground"></td>
								<td><div class="qd-color-cell"><input id="GridCellsBackgroundColor" type="color"><label class="qd-check"><input id="GridCellsBackgroundTransparent" type="checkbox"> <span data-i18n="optionNone"></span></label></div></td>
								<td><div class="qd-color-cell"><input id="GridCellsBackgroundColorHover" type="color"><label class="qd-check"><input id="GridCellsBackgroundTransparentHover" type="checkbox"> <span data-i18n="optionNone"></span></label></div></td>
							</tr>
							<tr>
								<td data-i18n="settingsBackgroundOpacity"></td>
								<td><span class="qd-number"><input id="GridCellsBackgroundOpacity" type="number" min="0" max="100" step="5">%</span></td>
								<td><span class="qd-number"><input id="GridCellsBackgroundOpacityHover" type="number" min="0" max="100" step="5">%</span></td>
							</tr>
							<tr>
								<td><span data-i18n="settingsGlassBlur"></span><br><small class="qd-hint" data-i18n="settingsGlassBlurHint"></small></td>
								<td><span class="qd-number"><input id="GridCellsBlur" type="number" min="0" max="40">px</span></td>
								<td><span class="qd-number"><input id="GridCellsBlurHover" type="number" min="0" max="40">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsShadow"></td>
								<td><select id="GridCellsShadow"><option value="0" data-i18n="optionNone"></option><option value="1" data-i18n="shadowSoft"></option><option value="2" data-i18n="shadowStrong"></option></select></td>
								<td><select id="GridCellsShadowHover"><option value="0" data-i18n="optionNone"></option><option value="1" data-i18n="shadowSoft"></option><option value="2" data-i18n="shadowStrong"></option></select></td>
							</tr>
						</tbody>
						<tbody id="TitleRows" hidden>
							<tr>
								<td data-i18n="settingsShowTitle"></td>
								<td><input id="GridCellsTitle" type="checkbox" class="qd-switch"></td>
								<td><input id="GridCellsTitleHover" type="checkbox" class="qd-switch"></td>
							</tr>
							<tr>
								<td data-i18n="settingsHeight"></td>
								<td><span class="qd-number"><input id="GridCellsTitleHeight" type="number" min="0">px</span></td>
								<td><span class="qd-number"><input id="GridCellsTitleHeightHover" type="number" min="0">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsFontSize"></td>
								<td><span class="qd-number"><input id="GridCellsTitleFontSize" type="number" min="1" step="0.5">pt</span></td>
								<td><span class="qd-number"><input id="GridCellsTitleFontSizeHover" type="number" min="1" step="0.5">pt</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsDividerWidth"></td>
								<td><span class="qd-number"><input id="GridCellsTitleBorderSize" type="number" min="0">px</span></td>
								<td><span class="qd-number"><input id="GridCellsTitleBorderSizeHover" type="number" min="0">px</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsTextColor"></td>
								<td><input id="GridCellsTitleColor" type="color"></td>
								<td><input id="GridCellsTitleColorHover" type="color"></td>
							</tr>
							<tr>
								<td data-i18n="settingsBackground"></td>
								<td><div class="qd-color-cell"><input id="GridCellsTitleBackgroundColor" type="color"><label class="qd-check"><input id="GridCellsTitleBackgroundTransparent" type="checkbox"> <span data-i18n="optionNone"></span></label></div></td>
								<td><div class="qd-color-cell"><input id="GridCellsTitleBackgroundColorHover" type="color"><label class="qd-check"><input id="GridCellsTitleBackgroundTransparentHover" type="checkbox"> <span data-i18n="optionNone"></span></label></div></td>
							</tr>
							<tr>
								<td data-i18n="settingsBackgroundOpacity"></td>
								<td><span class="qd-number"><input id="GridCellsTitleBackgroundOpacity" type="number" min="0" max="100" step="5">%</span></td>
								<td><span class="qd-number"><input id="GridCellsTitleBackgroundOpacityHover" type="number" min="0" max="100" step="5">%</span></td>
							</tr>
							<tr>
								<td data-i18n="settingsFont"></td>
								<td colspan="2"><div class="qd-inline"><select id="GridCellsTitleFont"></select><label class="qd-check"><input id="GridCellsTitleBold" type="checkbox"> <span data-i18n="settingsBold"></span></label></div></td>
							</tr>
							<tr>
								<td data-i18n="settingsPosition"></td>
								<td colspan="2"><select id="GridCellsTitlePosition">
									<option value="0" data-i18n="titleBelow"></option>
									<option value="1" data-i18n="titleOver"></option>
								</select></td>
							</tr>
						</tbody>
					</table>
				</section>
			</div>

			<!-- ===== Themes ===== -->
			<div class="qd-panel qd-stack is-wide" id="TabThemes" role="tabpanel" aria-labelledby="TabThemesButton" data-i18n-intro="settingsThemesIntro" hidden>
				<div id="ThemeStatus" class="qd-banner" hidden></div>
				<div class="qd-themes" id="ThemeList" data-no-dirty></div>
			</div>

			<!-- ===== Backup ===== -->
			<div class="qd-panel qd-stack" id="TabBackup" role="tabpanel" aria-labelledby="TabBackupButton" data-i18n-intro="settingsBackupIntro" hidden>
				<div id="ImportStatus" class="qd-banner" hidden></div>

				<section class="qd-card">
					<h2 data-i18n="backupTitle"></h2>
					<p class="qd-muted" data-i18n="backupIntro"></p>
					<div class="qd-inline">
						<button type="button" class="qd-btn is-primary" id="BtnExport" data-i18n-title="backupExportHint" data-i18n="backupExport"></button>
						<button type="button" class="qd-btn" id="BtnImport" data-i18n-title="backupImportHint" data-i18n="backupImport"></button>
					</div>
					<input id="ImportFile" type="file" accept=".json,application/json" class="qd-file" data-no-dirty tabindex="-1">
				</section>

				<section class="qd-card">
					<h2 data-i18n="backupOriginalTitle"></h2>
					<p class="qd-muted" data-i18n="backupOriginalIntro"></p>
					<ol class="qd-steps">
						<li data-i18n="backupStep1"></li>
						<li><span data-i18n="backupStep2"></span><br>
							<button type="button" class="qd-btn is-small" id="BtnCopySnippet" data-i18n="backupCopySnippet"></button></li>
						<li data-i18n="backupStep3"></li>
					</ol>
				</section>
			</div>
		</main>

		<footer class="qd-footer">
			<span class="qd-status" id="Status" aria-live="polite"></span>
			<button type="button" class="qd-btn" id="BtnDiscard" data-i18n-title="settingsDiscardHint" data-i18n="settingsDiscard"></button>
			<button type="button" class="qd-btn is-primary" id="BtnApply" data-i18n-title="settingsApplyHint" data-i18n="buttonApply"></button>
		</footer>
	</body>
</html>
