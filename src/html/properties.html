<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="shortcut icon" type="image/svg+xml" href="../img/icon.svg" />
		<title data-i18n="propertiesPageTitle"></title>
		<link rel="stylesheet" href="../css/ui.css" />
		<link rel="stylesheet" href="../css/page.css" />
		<script type="text/javascript" src="../js/common.js"></script>
		<script type="text/javascript" src="../js/ui.js"></script>
		<script type="text/javascript" src="../js/themes.js"></script>
		<script type="text/javascript" src="/js/properties.js"></script>
	</head>
	<body class="qd qd-page">
		<header class="qd-header">
			<div class="qd-header-icon" aria-hidden="true"><svg id="IconBookmark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 7.5h15"/><circle cx="5" cy="5.5" r=".5" fill="currentColor"/><circle cx="7" cy="5.5" r=".5" fill="currentColor"/></svg><svg id="IconFolder" hidden viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2h6.6a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg></div>
			<div class="qd-header-text">
				<h1 class="qd-title" id="HeaderTitle" data-i18n="propertiesTitle"></h1>
				<p class="qd-subtitle" id="HeaderSubtitle">&nbsp;</p>
			</div>
			<button type="button" class="qd-icon-btn" id="BtnClose" data-i18n-title="propertiesCloseHint" data-i18n-aria-label="buttonClose"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
		</header>

		<main class="qd-content qd-props">
			<!-- the tile, drawn as on the dial (QDThemes.paintTile); its picture is the drop zone -->
			<div class="qd-props-tile">
				<h2 data-i18n="propertiesOnDial"></h2>
				<div class="qd-tile-stage" id="TileStage">
					<div class="qd-tile-slot">
						<div class="qd-tile" id="TilePreview">
							<div class="qd-tile-picture" id="ImageZone" data-i18n-title="imageDropHere">
								<div class="qd-preview-img" id="ImagePreview"></div>
								<div class="qd-preview-empty" id="ImageEmpty" hidden data-i18n="propertiesNoPicture"></div>
								<div class="qd-preview-drop" data-i18n="imageDropToUse"></div>
							</div>
							<div class="qd-tile-title" id="TileTitle"></div>
						</div>
					</div>
				</div>
				<div class="qd-setting">
					<label class="qd-setting-text" for="ImageMode" data-i18n="imageFit"></label>
					<select id="ImageMode">
						<option value="-1" data-i18n="optionDefault"></option>
						<option value="0" data-i18n="fitStretch"></option>
						<option value="1" data-i18n="fitCover"></option>
						<option value="2" data-i18n="fitContain"></option>
						<option value="3" data-i18n="fitCenter"></option>
					</select>
				</div>
				<div class="qd-props-actions">
					<button type="button" class="qd-link-btn" id="ImageReset" data-i18n-title="propertiesRevertHint" data-i18n="propertiesRevert"></button>
					<button type="button" class="qd-link-btn" id="ImageDefault" data-i18n-title="propertiesUseDefaultHint" data-i18n="propertiesUseDefault"></button>
				</div>
				<div class="qd-setting" id="ImageLockRow">
					<label class="qd-setting-text" for="ImageLocked"><span data-i18n="propertiesKeepPicture"></span><small data-i18n="propertiesKeepPictureHint"></small></label>
					<input id="ImageLocked" type="checkbox" class="qd-switch">
				</div>
			</div>

			<div class="qd-props-form">
				<div>
					<div class="qd-row">
						<label for="Title" data-i18n="propertiesTitleLabel"></label>
						<div class="qd-inline">
							<input id="Title" type="text" class="qd-grow" autocomplete="off" spellcheck="false">
							<label class="qd-lock" id="TitleLockBox" data-i18n-title="propertiesLockTitleHint">
								<input id="TitleLocked" type="checkbox" data-i18n-aria-label="propertiesLockTitle">
								<span class="qd-lock-off"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.8-1"/></svg></span><span class="qd-lock-on"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span>
							</label>
						</div>
					</div>
					<div class="qd-row" id="UrlRow">
						<label for="Url" data-i18n="propertiesAddress"></label>
						<input id="Url" type="url" autocomplete="off" spellcheck="false" placeholder="https://">
					</div>
				</div>

				<div class="qd-source" id="SourceRow">
					<h2 id="SourceLabel" data-i18n="propertiesPicture"></h2>
					<div class="qd-source-tabs" role="group" aria-labelledby="SourceLabel">
						<button type="button" class="qd-source-tab" id="SourcePageOption" aria-pressed="false" data-source="0" data-i18n="propertiesSourcePage" data-i18n-title="propertiesSourcePageHint"></button>
						<button type="button" class="qd-source-tab" id="SourceSiteIconOption" aria-pressed="false" data-source="1" data-i18n="propertiesSourceSiteIcon" data-i18n-title="propertiesSourceSiteIconHint"></button>
						<button type="button" class="qd-source-tab" id="SourceIconOption" aria-pressed="false" data-source="4" data-i18n="propertiesSourceIcon" data-i18n-title="propertiesSourceIconHint"></button>
						<button type="button" class="qd-source-tab" id="SourceFileOption" aria-pressed="false" data-source="3" data-i18n="propertiesSourceFile" data-i18n-title="imageChoose"></button>
					</div>
				</div>

				<!-- the panel of the source shown: Page has only its hint, Site icon its icons, Icon the picker, File a Choose button -->
				<div class="qd-icon-choices" id="IconList" role="group" data-i18n-aria-label="propertiesSourceSiteIcon" hidden></div>
				<div class="qd-icon-picker" id="IconPicker" hidden>
					<div class="qd-inline">
						<select id="IconSet" data-i18n-aria-label="propertiesIconSet">
							<option value="outline" data-i18n="propertiesIconSetOutline"></option>
							<option value="pixel" data-i18n="propertiesIconSetPixel"></option>
							<option value="retro" data-i18n="propertiesIconSetRetro"></option>
						</select>
						<input id="IconSearch" type="text" class="qd-grow" autocomplete="off" spellcheck="false" data-i18n-placeholder="propertiesIconSearch" data-i18n-aria-label="propertiesIconSearch">
					</div>
					<div class="qd-inline">
						<span class="qd-hint qd-grow qd-icon-set-about" id="IconSetAbout"></span>
						<button type="button" class="qd-btn is-small is-primary" id="IconSetDownload" hidden></button>
						<button type="button" class="qd-btn is-small" id="IconSetRemove" data-i18n="propertiesIconSetRemove" hidden></button>
					</div>
					<div class="qd-icon-grid" id="IconGrid" role="group" data-i18n-aria-label="propertiesSourceIcon"></div>
					<div class="qd-inline" id="IconColors">
						<label class="qd-unit" for="IconColor" data-i18n="propertiesIconColor"></label>
						<input id="IconColor" type="color">
						<span class="qd-grow"></span>
						<label class="qd-check"><input id="IconBackground" type="checkbox"><span data-i18n="propertiesIconBackground"></span></label>
						<input id="IconBackgroundColor" type="color" data-i18n-aria-label="propertiesIconBackgroundColor">
					</div>
				</div>
				<div class="qd-inline" id="ImageChooseRow" hidden>
					<label class="qd-btn" for="ImageFile" id="ImageChoose" tabindex="0" role="button" data-i18n="imageChoose"></label>
					<input id="ImageFile" class="qd-file" type="file" accept="image/*" tabindex="-1">
				</div>
				<p class="qd-hint qd-source-hint" id="SourceHint" aria-live="polite"></p>
				<span class="qd-hint" data-i18n="propertiesPasteHint"></span>
			</div>
		</main>

		<footer class="qd-footer">
			<span class="qd-status" id="Status" aria-live="polite"></span>
			<button type="button" class="qd-btn" id="BtnCancel" data-i18n="buttonCancel"></button>
			<button type="button" class="qd-btn" id="BtnApply" data-i18n="buttonApply"></button>
			<button type="button" class="qd-btn is-primary" id="BtnOk" data-i18n="buttonOk"></button>
		</footer>
	</body>
</html>
